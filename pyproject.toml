[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "claude-code-env-editor"
dynamic = ["version"]
description = "TUI to view, edit, and verify Anthropic environment variables for Claude Code"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kraig Ochieng" }]
requires-python = ">=3.10"
dependencies = [
  "textual>=0.80",
  "httpx>=0.27",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "commitizen>=3"]

[project.scripts]
claude-code-env-editor = "claude_code_env_editor.cli:main"
cce = "claude_code_env_editor.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_env_editor"]

[tool.hatch.build.hooks.vcs]
version-file = "src/claude_code_env_editor/_version.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"

[tool.semantic_release]
allow_zero_version = true
major_on_zero = false
tag_format = "v{version}"
commit_parser = "conventional"
build_command = ""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
